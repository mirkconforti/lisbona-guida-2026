<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D3049">
<title>Portugal · Travel Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1EAD9;
  --paper2:#E8DFC9;
  --ink:#17262C;
  --ink-soft:#4A5A5F;
  --navy:#0D3049;
  --navy2:#123B58;
  --azul:#1C6088;
  --azul-pale:#D6E8EE;
  --azul-pale2:#EAF3F6;
  --ochre:#B9752E;
  --ochre-pale:#F3E1C9;
  --coral:#AE4A3B;
  --coral-pale:#F3DCD6;
  --olive:#5E7048;
  --olive-pale:#E1E7D4;
  --line:rgba(13,48,73,.14);
  --card:#FFFFFF;
  --shadow:0 1px 2px rgba(13,48,73,.06), 0 8px 24px -12px rgba(13,48,73,.18);
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.serif{font-family:'Fraunces',serif;}
#root{max-width:540px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}

/* ---- azulejo pattern ---- */
.azulejo-band{
  background-color:var(--navy);
  background-image:
    radial-gradient(circle at 12px 12px, rgba(255,255,255,.10) 0 3px, transparent 3.5px),
    radial-gradient(circle at 36px 36px, rgba(255,255,255,.10) 0 3px, transparent 3.5px),
    linear-gradient(135deg, rgba(255,255,255,.05) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.05) 75%),
    linear-gradient(45deg, rgba(255,255,255,.05) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.05) 75%);
  background-size:48px 48px, 48px 48px, 24px 24px, 24px 24px;
  background-position:0 0, 24px 24px, 0 0, 0 0;
}

/* ---- top header ---- */
.hero{
  color:#fff;
  padding:22px 20px 26px;
  border-radius:0 0 26px 26px;
  position:relative;
  overflow:hidden;
}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;}
.hero-flag{font-size:22px;letter-spacing:.02em;}
.hero-title{font-family:'Fraunces',serif;font-weight:600;font-size:26px;line-height:1.05;margin:10px 0 4px;position:relative;z-index:2;}
.hero-sub{font-size:12.5px;opacity:.82;letter-spacing:.02em;position:relative;z-index:2;}
.hero-route{font-size:11.5px;opacity:.72;margin-top:6px;position:relative;z-index:2;}
.hero-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.22);
  padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;
}

/* ---- content scroll area ---- */
.view{padding:16px 16px 100px;flex:1;}
.section-eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--azul);
  margin:22px 0 8px;display:flex;align-items:center;gap:8px;
}
.section-eyebrow::after{content:"";flex:1;height:1px;background:var(--line);}
h2.title{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:2px 0 12px;}
p.lede{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 14px;}

/* ---- cards ---- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px;
  margin-bottom:12px;
}
.card.flat{box-shadow:none;}
.card-tap{cursor:pointer;}
.row{display:flex;align-items:center;gap:10px;}
.row.between{justify-content:space-between;}
.row.top{align-items:flex-start;}

/* ---- badges / pills ---- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:999px;white-space:nowrap;}
.badge.must{background:var(--coral-pale);color:var(--coral);}
.badge.high{background:var(--ochre-pale);color:var(--ochre);}
.badge.worth{background:var(--azul-pale);color:var(--azul);}
.badge.optional{background:#EDEAE0;color:var(--ink-soft);}
.badge.info{background:var(--azul-pale2);color:var(--azul);}
.badge.olive{background:var(--olive-pale);color:var(--olive);}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:999px;
  white-space:nowrap;
}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.chip-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;}
.chip-scroll::-webkit-scrollbar{display:none;}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-weight:700;font-size:13px;padding:10px 14px;border-radius:12px;border:none;
}
.btn.primary{background:var(--navy);color:#fff;}
.btn.ghost{background:var(--azul-pale2);color:var(--azul);}
.btn.outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn.block{width:100%;}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px;}

/* ---- timeline ---- */
.timeline{position:relative;margin-top:6px;}
.timeline::before{
  content:"";position:absolute;left:29px;top:6px;bottom:6px;width:2px;
  background:repeating-linear-gradient(to bottom, var(--line) 0 5px, transparent 5px 10px);
}
.t-item{display:flex;gap:12px;margin-bottom:14px;position:relative;}
.t-time{
  width:58px;flex-shrink:0;font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--navy);
  padding-top:10px;text-align:right;
}
.t-dot{
  width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--azul);
  margin-top:11px;flex-shrink:0;z-index:1;
}
.t-dot.must{border-color:var(--coral);}
.t-dot.high{border-color:var(--ochre);}
.t-dot.done{background:var(--olive);border-color:var(--olive);}
.t-body{flex:1;min-width:0;}

/* ---- detail rows ---- */
.kv{display:flex;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--ink-soft);width:96px;flex-shrink:0;}
.kv .v{flex:1;font-weight:500;}
.source-note{font-size:10.5px;color:var(--ink-soft);margin-top:8px;font-style:italic;}
.verify{color:var(--coral);font-weight:700;}

/* ---- bottom nav ---- */
.tabbar{
  position:sticky;bottom:0;left:0;right:0;
  background:rgba(241,234,217,.92);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:50;
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--ink-soft);font-size:9.5px;font-weight:700;padding:4px 8px;border-radius:10px;letter-spacing:.02em;}
.tab .ic{font-size:19px;}
.tab.on{color:var(--navy);}
.tab.on .ic{transform:translateY(-1px);}

/* ---- quick chips home ---- */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 4px;}
.quick-item{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;
  display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--navy);
}
.quick-item .ic{font-size:19px;}

/* ---- day tabs ---- */
.day-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{
  flex-shrink:0;width:58px;text-align:center;padding:10px 4px;border-radius:14px;background:#fff;
  border:1px solid var(--line);
}
.day-tab .dn{font-size:10px;font-weight:700;color:var(--ink-soft);}
.day-tab .dd{font-family:'Fraunces',serif;font-weight:600;font-size:17px;}
.day-tab.on{background:var(--navy);border-color:var(--navy);}
.day-tab.on .dn{color:rgba(255,255,255,.65);}
.day-tab.on .dd{color:#fff;}

/* ---- misc ---- */
.divider{height:1px;background:var(--line);margin:14px 0;}
.checkbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--azul);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
.checkbox.on{background:var(--olive);border-color:var(--olive);}
.progress{height:8px;border-radius:99px;background:var(--azul-pale);overflow:hidden;}
.progress > div{height:100%;background:var(--olive);border-radius:99px;}
.alert{
  background:var(--coral-pale);border:1px solid rgba(174,74,59,.25);color:#7A3226;
  padding:10px 12px;border-radius:12px;font-size:12.5px;font-weight:600;line-height:1.4;margin-bottom:10px;
  display:flex;gap:8px;align-items:flex-start;
}
textarea.note-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:13px;resize:vertical;min-height:70px;background:#fff;}
.modal-overlay{position:fixed;inset:0;background:rgba(13,20,24,.5);z-index:99;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--paper);width:100%;max-width:540px;border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;padding:6px 16px 24px;animation:up .22s ease;}
@keyframes up{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:4px;background:var(--line);border-radius:99px;margin:10px auto 6px;}
.close-x{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.15);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;border:none;}
.small{font-size:11.5px;color:var(--ink-soft);}
.tag-region{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);}
.photo-card{background:linear-gradient(180deg,var(--azul-pale2),#fff);border:1px solid var(--azul-pale);border-radius:14px;padding:12px;margin-top:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
::selection{background:var(--ochre-pale);}
</style>
</head>

<script>

const ICONS = {flight:"✈️",car:"🚗",walk:"🚶",trek:"🥾",kayak:"🛶",beach:"🏖️",photo:"📸",food:"🍴",hotel:"🏨",

const PR = {must:{label:"MUST DO", emoji:"🔥", cls:"must"}, high:{label:"HIGH PRIORITY", emoji:"⭐", cls:"high"},
  worth:{label:"WORTH IT", emoji:"✅", cls:"worth"}, optional:{label:"OPTIONAL", emoji:"➕", cls:"optional"}};

/* ---------------- DAYS ---------------- */
const DAYS = [
{
  id:1, date:"2026-09-04", label:"4 SET", weekday:"Venerdì", region:"ALGARVE",
  title:"Faro → Praia da Marinha → Benagil → Algar Seco → Lagos",
  hotel:{name:"Aqualuz Lagos by The Editory (o alternativa simile)", note:"4★, piscina, 10 min a piedi dal centro/marina di Lagos, parcheggio disponibile. Alternativa più economica: Vinyl Flat B&B (vicino marina, ~8.2/10). Prezzo a notte in alta stagione settembrina: DA VERIFICARE su Booking/Hotel diretto — indicativamente 100–150€/notte, sopra il budget ideale di 100€ per l'alta stagione dell'Algarve.", nights:2, map:mapsQ("Aqualuz Lagos by The Editory")},
  activities:[
    {t:"07:45", ti:"Atterraggio Faro (FAO)", ic:ICONS.flight, pr:"must", du:"—", co:"Volo prenotato", ds:"Volo Bergamo (BGY) → Faro (FAO), arrivo 07:45. Ritiro bagagli ~20–30 min.", al:"Sbarco presto: molti banchi noleggio aprono dalle 06:00, ma conferma l'orario esatto della tua compagnia."},
    {t:"08:20", ti:"Ritiro auto a noleggio", ic:ICONS.car, pr:"must", du:"30–40 min", co:"Vedi sezione Auto", ds:"Banco noleggio in aeroporto o navetta al deposito esterno (variabile per compagnia). Controlla l'auto e fotografa ogni graffio prima di firmare.", bk:{level:"red", note:"PRENOTARE SUBITO — l'auto non è ancora prenotata", url:"#"}, map:mapsQ("Faro Airport car rental")},
    {t:"09:15", ti:"Faro → Praia da Marinha", ic:ICONS.car, pr:"worth", du:"Maps 45 min · reale 55–60 min", co:"Pedaggio A22 ~4–5€", ds:"Autostrada A22 poi strade secondarie verso Benagil/Marinha. Faro stessa non riceve tempo oggi: è solo il punto di arrivo.", map:mapsDir("Praia da Marinha, Lagoa")},
    {t:"10:15", ti:"Praia da Marinha", ic:ICONS.beach, pr:"must", du:"1 h", co:"Gratis (parcheggio a pagamento)", ds:"La spiaggia più fotografata dell'Algarve: scogliere ocra, archi naturali, acqua turchese vista dall'alto. Solo panorama, non bagno (lo facciamo a Camilo).",
      ph:{title:"📸 MUST PHOTO — Praia da Marinha", how:"Dal parcheggio, 5 min a piedi fino alla scalinata panoramica in cima alla scogliera.", cosa:"Gli archi e i faraglioni dall'alto, con la scalinata di legno come elemento in primo piano.", dir:"Verso ovest per includere gli archi principali in controluce dolce.", ultrawide:"Sì, essenziale per includere l'intera baia.", momento:"Mattina presto (come oggi): luce laterale morbida, meno gente."},

    {t:"11:40", ti:"Kayak alla Grotta di Benagil", ic:ICONS.kayak, pr:"must", du:"2 h (tour guidato)", co:"€25–45 a persona, stimato — verificare all'atto della prenotazione", ds:"Dal 2024 l'accesso alla grotta è consentito SOLO con operatore autorizzato: niente più nuoto libero né kayak fai-da-te. Tour guidato in kayak da spiaggia di Benagil o Carvalho, ~1,5–2h, con soste per foto dentro la grotta (i motoscafi non possono fermarsi, i kayak sì).",
      bk:{level:"red", note:"PRENOTARE SUBITO — nei weekend estivi gli slot migliori si esauriscono. Cerca operatori locali certificati (es. Benagil Kayak Tours, Kayak Adventures Algarve) con recensioni verificate e cancellazione gratuita.", url:"https://www.google.com/search?q=Benagil+cave+kayak+tour+official+operator"},

      pk:{name:"Parcheggio Benagil (Rua Praia de Benagil)", note:"Piccolo e affollato in stagione — molti operatori includono un punto di ritrovo con indicazioni proprie.", map:mapsQ("Praia de Benagil parking")}},
    {t:"13:45", ti:"Pranzo a Benagil / Carvoeiro", ic:ICONS.food, pr:"worth", du:"1 h", co:"€15–25 a persona", ds:"Cataplana o peixe grelhado in una tasca di pesce vicino alla spiaggia, non il primo ristorante turistico sul lungomare."},
    {t:"15:00", ti:"Algar Seco (Carvoeiro)", ic:ICONS.sea, pr:"high", du:"45 min", co:"Gratis", ds:"Formazioni rocciose spettacolari, grotte, il celebre 'Boneco' (finestra naturale sul mare) raggiungibile con breve sentiero e scalini.",

    {t:"16:00", ti:"Carvoeiro → Lagos", ic:ICONS.car, pr:"worth", du:"Maps 35 min · reale 45 min", co:"—", ds:"Strada N125, possibile traffico in uscita da Carvoeiro nel tardo pomeriggio.", map:mapsDir("Lagos, Portugal")},
    {t:"17:00", ti:"Check-in hotel a Lagos", ic:ICONS.hotel, pr:"worth", du:"—", co:"Vedi Hotel", ds:"Primo di due pernottamenti a Lagos."},

    {t:"20:15", ti:"Cena a Lagos", ic:ICONS.food, pr:"worth", du:"1,5 h", co:"€20–30 a persona", ds:"Cerca una tasca fuori dall'asse principale turistico (zona Rua 25 de Abril è la più battuta, prova le traverse)."}
  ]
},
{
  id:2, date:"2026-09-05", label:"5 SET", weekday:"Sabato", region:"ALGARVE",
  title:"Ponta da Piedade → Praia do Camilo → Sagres → Cabo de São Vicente",
  hotel:{name:"Stessa struttura di Lagos", note:"Seconda notte, nessun trasferimento.", nights:0},
  activities:[

    {t:"08:45", ti:"Ponta da Piedade — solo a piedi", ic:ICONS.walk2, pr:"must", du:"1,5–2 h reali (cammino + foto + soste)", co:"Gratis (parcheggio a pagamento)", ds:"NIENTE barca: il percorso a piedi è superiore. Dal parcheggio, scendi la lunga scalinata (144 gradini) verso il faro; da lì il sentiero costeggia scogliere dorate, archi e faraglioni con più punti panoramici. Ordine consigliato: parcheggio → passerella sul promontorio ovest (vista d'insieme) → scalinata verso il livello del mare → grotte e archi via sentiero secondario verso est.",

      pk:{name:"Parque de Estacionamento Ponta da Piedade", note:"Parcheggio grande ma pieno entro le 10 in alta stagione — arriviamo presto apposta.", map:mapsQ("Ponta da Piedade parking")}},
    {t:"10:45", ti:"Ponta da Piedade → Praia do Camilo", ic:ICONS.car, pr:"worth", du:"5 min", co:"—", map:mapsDir("Praia do Camilo, Lagos")},

    {t:"12:15", ti:"Lagos → Sagres", ic:ICONS.car, pr:"worth", du:"Maps 30 min · reale 35–40 min", co:"—", map:mapsDir("Sagres, Portugal")},
    {t:"13:00", ti:"Pranzo a Sagres", ic:ICONS.food, pr:"worth", du:"1 h", co:"€18–28 a persona", ds:"Peixe grelhado o marisco in una tasca vicino al porto, lontano dall'asse principale."},

/* =========================================================
   STORAGE (window.storage — con fallback in memoria)
   ========================================================= */
const memStore = {};
async function sGet(key, shared=false){
  try{
    if(window.storage){ const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; }
  }catch(e){ /* key not found or storage unavailable */ }
  return memStore[key] !== undefined ? memStore[key] : null;
}
async function sSet(key, value, shared=false){
  memStore[key] = value;
  try{
    if(window.storage){ await window.storage.set(key, JSON.stringify(value), shared); }
  }catch(e){ /* ignore, memory fallback still applied */ }
}

function todayISO(){ const d=today; return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function tripDayForToday(){ return DAYS.find(d=>d.date===todayISO()) || null; }

async function loadState(){
  const c = await sGet("checklist"); if(c) STATE.checklist = c;
  const b = await sGet("bookingStatus"); if(b) STATE.bookingStatus = b; else { const init={}; BOOKINGS.forEach(x=>init[x.id]=x.status); STATE.bookingStatus=init; }
  const p = await sGet("packing"); if(p) STATE.packing = p;
  const dy = await sGet("diary"); if(dy) STATE.diary = dy;
}

function fmtDate(iso){
  const d = new Date(iso+"T12:00:00");
  const days=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
  return days[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1);
}

    <div class="kv"><div class="k">Kayak Benagil</div><div class="v">Sì, valore alto: riprese immersive dentro la grotta impossibili da ottenere con foto singole.</div></div>

}
function nowHHMM(){ const n=new Date(); return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"); }
function computeReadiness(){
  const total = BOOKINGS.length;
  const done = BOOKINGS.filter(b=>STATE.bookingStatus[b.id]==='booked').length;
  return Math.round((done/total)*100);
}

async function toggleCheck(dayId, idx){
  if(!STATE.checklist[dayId]) STATE.checklist[dayId] = {};
  STATE.checklist[dayId][idx] = !STATE.checklist[dayId][idx];
  await sSet("checklist", STATE.checklist);
  render();
}

function renderDiaryForm(dayId){
  const entry = STATE.diary[dayId] || {};
  const fields = [["momento","Momento più bello"],["foto","Foto preferita"],["piatto","Miglior piatto"],["luogo","Luogo preferito"],["libera","Nota libera"]];
  return fields.map(([k,label])=>`
    <div style="margin-bottom:10px;">
      <div class="small" style="font-weight:700;margin-bottom:4px;">${label}</div>
      <textarea class="note-input" style="min-height:44px;" data-day="${dayId}" data-field="${k}" oninput="saveDiaryField(this)">${entry[k]||''}</textarea>
    </div>`).join('');
}
let diaryTimer=null;
function saveDiaryField(el){
  const dayId = el.getAttribute('data-day'), field = el.getAttribute('data-field');
  if(!STATE.diary[dayId]) STATE.diary[dayId]={};
  STATE.diary[dayId][field] = el.value;
  clearTimeout(diaryTimer);
  diaryTimer = setTimeout(()=>sSet("diary", STATE.diary), 500);
}

let mapFilter = "tutti";
function renderMap(){
  const cats = [
    {k:"tutti", l:"Tutti"}, {k:"must", l:"🔥 Must"}, {k:"hotel", l:"🏨 Hotel"},
    {k:"food", l:"🍴 Cibo"}, {k:"photo", l:"📸 Foto"}, {k:"trek", l:"🥾 Trek"}
  ];
  const places = [];
  DAYS.forEach(d=>{
    if(d.hotel && d.hotel.nights>0) places.push({cat:"hotel", ic:"🏨", n:d.hotel.name, sub:"Hotel · "+d.label, q:d.hotel.name});
    d.activities.forEach(a=>{
      let cat = a.ic===ICONS.food?"food": a.ph?"photo": a.ic===ICONS.trek?"trek": (a.pr==="must"?"must":"other");
      places.push({cat, ic:a.ic, n:a.ti, sub:d.label+" · "+a.t, q:a.map ? null : a.ti});
      if(a.map) places[places.length-1].mapUrl = a.map;
    });
  });
  const filtered = mapFilter==="tutti" ? places : places.filter(p=>p.cat===mapFilter);
  return `
  ${header("Mappa & Naviga","🗺️")}
  <div class="view">
    <p class="lede">Elenco filtrabile di tutte le tappe del viaggio con accesso diretto alla navigazione. (In questa build non è integrata una mappa interattiva unica — ogni tappa apre Google Maps con il percorso pronto.)</p>
    <div class="chip-scroll">
      ${cats.map(c=>`<button class="chip ${mapFilter===c.k?'active':''}" onclick="setMapFilter('${c.k}')">${c.l}</button>`).join('')}
    </div>
    ${filtered.map(p=>`
      <div class="card flat" style="border:1px solid var(--line);padding:12px;">
        <div class="row between">
          <div class="row" style="gap:8px;"><span style="font-size:18px;">${p.ic}</span><div><div style="font-weight:700;font-size:13px;">${p.n}</div><div class="small">${p.sub}</div></div></div>
          <a class="btn ghost sm" href="${p.mapUrl || mapsDir(p.q || p.n)}" target="_blank" rel="noopener">🧭</a>
        </div>
      </div>`).join('')}
  </div>`;
}
function setMapFilter(k){ mapFilter=k; render(); }

  ${header("Cosa portare","🎒")}
  <div class="view">
    <p class="lede">Solo ciò che serve davvero per QUESTO viaggio — non una lista generica.</p>
    ${PACKING.map((item,i)=>`
      <div class="card flat" style="border:1px solid var(--line);padding:12px;">
        <div class="row" style="gap:10px;">
          <button class="checkbox ${STATE.packing[i]?'on':''}" onclick="togglePacking(${i})">${STATE.packing[i]?'✓':''}</button>
          <div style="font-size:13px;">${item}</div>
        </div>
      </div>`).join('')}
  </div>`;
}
async function togglePacking(i){
  STATE.packing[i] = !STATE.packing[i];
  await sSet("packing", STATE.packing);
  render();
}

/* =========================================================
   VIEW: SAFETY
   ========================================================= */
function renderSafety(){
  return `
  ${header("Sicurezza","⚠️")}
  <div class="view">
    <p class="lede">Consigli sintetici, senza allarmismi — solo ciò che è utile sapere per questo itinerario.</p>
    ${SAFETY.map(s=>`<div class="card flat" style="border:1px solid var(--line);padding:12px;"><b style="font-size:13px;">${s.t}</b><p class="small" style="margin-top:6px;">${s.d}</p></div>`).join('')}
  </div>`;
}

/* =========================================================
   VIEW: BUDGET
   ========================================================= */
function renderBudget(){
  return `
  ${header("Budget","💶")}
  <div class="view">
    <p class="lede">Le voci "STIMATO" sono calcolate su prezzi tipici 2026 e vanno confermate; "DA PRENOTARE" non ha ancora un prezzo fissato; "PRENOTATO" è confermato.</p>
    ${BUDGET.map(b=>`
      <div class="card flat" style="border:1px solid var(--line);padding:12px;">
        <div class="row between">
          <b style="font-size:13px;">${b.cat}</b>
          <span class="badge ${b.stato==='PRENOTATO'?'worth':b.stato==='DA PRENOTARE'?'must':'info'}">${b.stato}</span>
        </div>
        <p class="small" style="margin-top:6px;">${b.note}</p>
        <div style="font-weight:700;font-size:13px;margin-top:4px;color:var(--navy);">${b.tot}</div>
      </div>`).join('')}
  </div>`;
}

/* =========================================================
   VIEW: MORE MENU
   ========================================================= */
function renderMore(){
  const items = [
    ["food","🍴","Mangiare qui","Specialità e ristoranti selezionati"],
    ["photo","📸","Photo Guide","Tutti i punti fotografici del viaggio"],
    ["car","🚗","Auto & Assicurazione","Confronto compagnie e coperture"],
    ["tickets","🎟️","Biglietti","Prezzi e link ufficiali"],
    ["weather","🌡️","Meteo","Clima di riferimento per la stagione"],
    ["packing","🎒","Valigia","Checklist essenziale per questo viaggio"],
    ["safety","⚠️","Sicurezza","Consigli pratici senza allarmismi"],
    ["budget","💶","Budget","Stima costi per categoria"],
  ];
  return `
  ${header("Altro","☰")}
  <div class="view">
    ${items.map(([v,ic,t,s])=>`
      <button class="card card-tap" style="width:100%;text-align:left;border:none;" onclick="goto('${v}')">
        <div class="row between">
          <div class="row" style="gap:10px;"><span style="font-size:20px;">${ic}</span><div><div style="font-weight:700;font-size:13.5px;">${t}</div><div class="small">${s}</div></div></div>
          <span style="color:var(--ink-soft);">›</span>
        </div>
      </button>`).join('')}
  </div>`;
}

/* =========================================================
   ROUTER / RENDER
   ========================================================= */
async function goto(view, param){
  STATE.view = view;
  if(param !== undefined) STATE.currentDayId = param;
  window.scrollTo({top:0, behavior:"instant"});
  await render();
}

async function render(){
  const root = document.getElementById("root");
  let content = "";
  switch(STATE.view){
    case "home": content = await renderHome(); break;
    case "day": content = await renderDay(STATE.currentDayId); break;
    case "map": content = renderMap(); break;
    case "bookings": content = await renderBookings(); break;
    case "food": content = renderFood(); break;
    case "photo": content = renderPhoto(); break;
    case "car": content = renderCar(); break;
    case "tickets": content = renderTickets(); break;
    case "weather": content = renderWeather(); break;
    case "packing": content = await renderPacking(); break;
    case "safety": content = renderSafety(); break;
    case "budget": content = renderBudget(); break;
    case "more": content = renderMore(); break;
    default: content = await renderHome();
  }
  const wrapped = STATE.view==="home" ? `<div class="view" style="padding-top:0;">${homeHero()}${content}</div>` : content;
  root.innerHTML = `
    <div style="flex:1;">${wrapped}</div>
    ${tabbar()}
  `;
}

function tabbar(){
  const tabs = [
    ["home","🏠","Home"], ["day","📅","Itinerario"], ["map","🗺️","Mappa"],
    ["bookings","📋","Prenot."], ["more","☰","Altro"]
  ];
  return `
  <div class="tabbar">
    ${tabs.map(([v,ic,l])=>`
      <button class="tab ${STATE.view===v?'on':''}" onclick="goto('${v}'${v==='day'?(', '+STATE.currentDayId):''})">
        <span class="ic">${ic}</span>${l}
      </button>`).join('')}
  </div>`;
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  await loadState();
  await render();
})();
</script>
</body>
</html>
